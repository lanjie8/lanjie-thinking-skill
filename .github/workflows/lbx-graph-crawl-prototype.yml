name: LBX Graph Crawl Prototype

on:
  push:
    branches: ["tmp/lbx-poi-crawl-20260907"]
    paths:
      - "scripts/lbx_graph_crawl_prototype.py"
      - ".github/workflows/lbx-graph-crawl-prototype.yml"

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Crawl Changsha graph
        run: python scripts/lbx_graph_crawl_prototype.py
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbx-graph-crawl-prototype
          path: graph_crawl_output/
          retention-days: 1
          if-no-files-found: warn
