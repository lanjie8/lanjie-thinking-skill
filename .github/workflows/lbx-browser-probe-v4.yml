name: LBX Browser Probe V4

on:
  push:
    branches:
      - tmp/lbx-poi-crawl-20260907
    paths:
      - scripts/lbx_browser_probe_v4.py
      - .github/workflows/lbx-browser-probe-v4.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 playwright opencv-python-headless
      - name: Run browser probe
        run: python scripts/lbx_browser_probe_v4.py
      - name: Upload browser probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbx-browser-probe-v4
          path: lbx_browser_probe_v4
          if-no-files-found: warn
          retention-days: 3
