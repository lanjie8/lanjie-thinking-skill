name: LBX Wrapper Fast Probe

on:
  push:
    branches: [tmp/lbx-poi-crawl-20260907]
    paths:
      - scripts/lbx_wrapper_fast.py
      - .github/workflows/lbx-wrapper-fast.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - run: python scripts/lbx_wrapper_fast.py
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrapper_fast_output
          git commit -m "Add LBX wrapper fast probe results [skip ci]" || exit 0
          git pull --rebase origin tmp/lbx-poi-crawl-20260907
          git push origin HEAD:tmp/lbx-poi-crawl-20260907
