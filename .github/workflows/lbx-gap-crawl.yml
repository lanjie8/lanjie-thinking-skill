name: LBX Nationwide Gap Fill Crawl

on:
  push:
    branches:
      - tmp/lbx-poi-gap-run-20260907
    paths:
      - .github/workflows/lbx-gap-crawl.yml

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      LBX_WORKERS: "12"
      LBX_BATCH_SIZE: "600"
      LBX_MAX_REQUESTS: "30000"
      LBX_MAX_SECONDS: "2300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check -q requests
      - name: Initialize output directory
        run: |
          mkdir -p lbx_gap_output
          printf 'gap crawl started\n' > lbx_gap_output/run_started.txt
      - name: Crawl non-core mainland markets
        run: python scripts/lbx_gap_crawl.py
      - name: Upload gap-fill output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbx-gap-fill-output
          path: lbx_gap_output/**
          if-no-files-found: error
          retention-days: 3
