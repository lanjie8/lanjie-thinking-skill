name: LBX Direct Store API Probe

on:
  push:
    branches: [tmp/lbx-poi-crawl-20260907]
    paths:
      - .github/workflows/lbx-direct-api-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q requests
      - run: python scripts/lbx_api_characterize.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbx-direct-api-probe
          path: api_characterize_output/
          retention-days: 2
          if-no-files-found: warn
