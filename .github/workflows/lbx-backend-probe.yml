name: LBX Paginated Backend Probe
on:
  push:
    branches: [tmp/lbx-poi-crawl-20260907]
    paths:
      - scripts/lbx_backend_probe.py
      - .github/workflows/lbx-backend-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - run: python scripts/lbx_backend_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: lbx-backend-probe
          path: lbx_backend_probe_output
          retention-days: 1
