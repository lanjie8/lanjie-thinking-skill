name: LBX Legacy Store Probe Fast

on:
  push:
    branches:
      - tmp/lbx-poi-crawl-20260907
    paths:
      - scripts/lbx_legacy_store_probe_fast.py
      - .github/workflows/lbx-legacy-store-probe-fast.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Probe public LBX store endpoint
        run: python scripts/lbx_legacy_store_probe_fast.py
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbx-legacy-store-probe-fast
          path: lbx_legacy_store_probe_fast/
          if-no-files-found: warn
          retention-days: 3
