name: LBX SCEP Chunk Discovery

on:
  push:
    branches:
      - tmp/lbx-poi-crawl-20260907
    paths:
      - scripts/lbx_scep_chunk_discovery.py
      - .github/workflows/lbx-scep-chunks.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python3 scripts/lbx_scep_chunk_discovery.py
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scep_output
          git commit -m "chore: save SCEP chunk discovery" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin tmp/lbx-poi-crawl-20260907 && git push origin HEAD:tmp/lbx-poi-crawl-20260907 && exit 0
            sleep 5
          done
          exit 1
