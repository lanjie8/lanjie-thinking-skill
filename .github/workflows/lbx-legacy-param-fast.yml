name: LBX Nationwide Store Crawl

on:
  push:
    branches: ["tmp/lbx-poi-crawl-20260907"]
    paths:
      - "scripts/lbx_legacy_param_probe_fast.py"
      - ".github/workflows/lbx-legacy-param-fast.yml"

permissions:
  contents: write

concurrency:
  group: lbx-nationwide-store-crawl
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Crawl nationwide store directory
        run: python scripts/lbx_legacy_param_probe_fast.py
      - name: Upload crawl output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbx-nationwide-store-crawl
          path: lbx_nationwide_output/
          retention-days: 1
          if-no-files-found: warn
      - name: Publish crawl output to temporary branch
        if: always()
        shell: bash
        run: |
          mkdir -p data/lbx_nationwide
          if [ -d lbx_nationwide_output ]; then
            cp -R lbx_nationwide_output/. data/lbx_nationwide/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lbx_nationwide
          if git diff --cached --quiet; then
            echo "No crawl output to publish."
          else
            git commit -m "Publish nationwide LBX store crawl"
            git push origin HEAD:tmp/lbx-poi-crawl-20260907
          fi
