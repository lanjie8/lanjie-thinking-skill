name: LBX Legacy Parameter Fast Probe

on:
  push:
    branches: ["tmp/lbx-poi-crawl-20260907"]
    paths:
      - "scripts/lbx_legacy_param_probe_fast.py"
      - ".github/workflows/lbx-legacy-param-fast.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Probe wrapper parameters
        run: python scripts/lbx_legacy_param_probe_fast.py
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbx-legacy-param-probe
          path: legacy_param_probe_output/
          retention-days: 1
          if-no-files-found: warn
