name: LBX Superfast Public Store Crawl

on:
  push:
    branches:
      - tmp/lbx-poi-crawl-20260907
    paths:
      - scripts/lbx_official_superfast.py
      - .github/workflows/lbx-poi-probe.yml

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Crawl public LBX nearby-store endpoint
        run: python scripts/lbx_official_superfast.py
      - name: Upload crawl output
        uses: actions/upload-artifact@v4
        with:
          name: lbx-official-superfast-output
          path: lbx_official_superfast_output/
          if-no-files-found: error
          retention-days: 7
