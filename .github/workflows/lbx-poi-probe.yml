name: LBX Branch Output Manifest

on:
  push:
    branches:
      - tmp/lbx-poi-crawl-20260907
    paths:
      - scripts/lbx_branch_manifest.py
      - .github/workflows/lbx-poi-probe.yml

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect existing crawl outputs
        run: python scripts/lbx_branch_manifest.py
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe_output/branch_manifest.json probe_output/branch_manifest.txt
          git commit -m "Add LBX branch output manifest" || exit 0
          git push origin HEAD:tmp/lbx-poi-crawl-20260907
