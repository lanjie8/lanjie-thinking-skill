name: LBX National Crawl Push

on:
  push:
    branches:
      - tmp/lbx-poi-crawl-20260907
    paths:
      - '.github/workflows/lbx-national-crawl-push.yml'
      - 'scripts/lbx_national_crawl.py'
      - 'trigger/lbx-national-crawl.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Crawl nationwide public LBX store API
        run: python scripts/lbx_national_crawl.py

      - name: Show summary
        if: always()
        run: |
          find lbx_national_output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          cat lbx_national_output/crawl_summary.json || true

      - name: Upload crawl output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbx-national-store-data
          path: lbx_national_output/
          retention-days: 7
          if-no-files-found: warn
