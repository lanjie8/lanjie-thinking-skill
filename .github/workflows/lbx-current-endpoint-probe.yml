name: LBX Current Endpoint Probe

on:
  push:
    branches:
      - tmp/lbx-poi-crawl-20260907
    paths:
      - scripts/lbx_current_endpoint_probe.py
      - .github/workflows/lbx-current-endpoint-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Probe endpoint
        run: python scripts/lbx_current_endpoint_probe.py
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbx-current-endpoint-probe
          path: lbx_current_endpoint_probe/
          if-no-files-found: warn
          retention-days: 3
