name: LBX Mobile Pagination Probe

on:
  push:
    branches:
      - tmp/lbx-poi-crawl-20260907
    paths:
      - scripts/lbx_mobile_pagination_probe.py
      - .github/workflows/lbx-mobile-pagination-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Run pagination probe
        run: python scripts/lbx_mobile_pagination_probe.py
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbx-mobile-pagination-probe
          path: mobile_pagination_probe_output/
          if-no-files-found: error
          retention-days: 3
