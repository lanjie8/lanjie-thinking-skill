name: LBX Resume Expand Artifact

on:
  push:
    branches: [tmp/lbx-poi-crawl-20260907]
    paths:
      - scripts/lbx_resume_expand.py
      - .github/workflows/lbx-resume-expand.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONUNBUFFERED: '1'
      LBX_INPUT_DIR: input
      LBX_OUT_DIR: lbx_resume_output
      LBX_WORKERS: '32'
      LBX_RPS: '28'
      LBX_MAX_RUNTIME: '780'
      LBX_BATCH_SIZE: '800'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - name: Download fast crawl snapshot
        uses: actions/download-artifact@v4
        with:
          name: lbx-fast-national-output
          path: input
          github-token: ${{ github.token }}
          run-id: 34109189392
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Resume graph and county-offset expansion
        run: python scripts/lbx_resume_expand.py
      - name: Show summary
        if: always()
        run: |
          find lbx_resume_output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          cat lbx_resume_output/crawl_stats.json || true
      - name: Upload expanded snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbx-resume-expanded-output
          path: lbx_resume_output/
          retention-days: 2
          if-no-files-found: warn
          compression-level: 6
