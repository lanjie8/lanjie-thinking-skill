name: LBX Store API Characterize

on:
  push:
    branches: [tmp/lbx-poi-crawl-20260907]
    paths:
      - scripts/lbx_store_api_characterize.py
      - .github/workflows/lbx-store-api-characterize.yml

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Characterize LBX public store API
        run: python scripts/lbx_store_api_characterize.py
      - name: Commit characterization output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lbx_store_api_characterize_output
          git commit -m "Add LBX store API characterization results [skip ci]" || exit 0
          git pull --rebase origin tmp/lbx-poi-crawl-20260907
          git push origin HEAD:tmp/lbx-poi-crawl-20260907
