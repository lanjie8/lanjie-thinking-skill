name: LBX Old Endpoint City Points
on:
  push:
    branches: [tmp/lbx-poi-crawl-20260907]
    paths: [scripts/lbx_old_endpoint_points.py, .github/workflows/lbx-old-endpoint-points.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {ref: tmp/lbx-poi-crawl-20260907}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests
      - run: python scripts/lbx_old_endpoint_points.py
      - name: Upload raw store points
        uses: actions/upload-artifact@v4
        with:
          name: lbx-old-endpoint-points
          path: old_endpoint_points_output/
          retention-days: 1
          if-no-files-found: error
