name: LBX Old Endpoint City Points
on:
  push:
    branches: [tmp/lbx-poi-crawl-20260907]
    paths: [scripts/lbx_old_endpoint_points.py, .github/workflows/lbx-old-endpoint-points.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {ref: tmp/lbx-poi-crawl-20260907}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests
      - run: python scripts/lbx_old_endpoint_points.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add old_endpoint_points_output
          git commit -m "Add LBX old endpoint point results [skip ci]" || exit 0
          git pull --rebase origin tmp/lbx-poi-crawl-20260907
          git push origin HEAD:tmp/lbx-poi-crawl-20260907
