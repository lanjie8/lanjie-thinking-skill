name: LBX Public Storefront Discovery

on:
  push:
    branches:
      - tmp/lbx-poi-crawl-20260907
    paths:
      - scripts/lbx_public_storefront_discovery.py
      - .github/workflows/lbx-storefront-discovery.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests beautifulsoup4 playwright
      - run: python -m playwright install chromium --with-deps >/dev/null
      - run: python scripts/lbx_public_storefront_discovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: lbx-public-storefront-discovery
          path: storefront_output
          retention-days: 3
      - name: Commit output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storefront_output
          git commit -m "chore: save public storefront discovery" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin tmp/lbx-poi-crawl-20260907 && git push origin HEAD:tmp/lbx-poi-crawl-20260907 && exit 0
            sleep 5
          done
          exit 1
