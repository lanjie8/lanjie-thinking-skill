name: LBX Postprocess Discovery

on:
  push:
    branches:
      - tmp/lbx-poi-crawl-20260907
    paths:
      - scripts/lbx_postprocess_discovery.py
      - .github/workflows/lbx-postprocess.yml

permissions:
  contents: write

jobs:
  postprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Postprocess discovery outputs
        run: python3 scripts/lbx_postprocess_discovery.py
      - name: Commit postprocessed output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add post_output
          git commit -m "chore: save LBX discovery postprocessing" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin tmp/lbx-poi-crawl-20260907 && git push origin HEAD:tmp/lbx-poi-crawl-20260907 && exit 0
            sleep 5
          done
          exit 1
