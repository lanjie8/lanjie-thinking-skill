name: LBX Baidu National POI Crawl

on:
  push:
    branches:
      - tmp/lbx-poi-crawl-20260907
    paths:
      - scripts/lbx_baidu_national_crawl.py
      - .github/workflows/lbx-baidu-national-crawl.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Crawl nationwide public POIs
        run: python scripts/lbx_baidu_national_crawl.py
      - name: Validate output
        run: |
          ls -lah lbx_crawl_output
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('lbx_crawl_output/crawl_summary.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          count = int(data.get('去重后门店数', 0))
          print(json.dumps(data, ensure_ascii=False, indent=2))
          if count <= 0:
              raise SystemExit('No stores were collected')
          PY
      - name: Upload crawl data
        uses: actions/upload-artifact@v4
        with:
          name: lbx-national-poi-2026-09-07
          path: lbx_crawl_output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

# Triggered for final nationwide collection on 2026-09-07.
