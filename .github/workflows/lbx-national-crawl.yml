name: LBX National Store Crawl

on:
  push:
    branches: [tmp/lbx-poi-crawl-20260907]
    paths:
      - scripts/lbx_national_crawl.py
      - .github/workflows/lbx-national-crawl.yml
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      LBX_WORKERS: '12'
      LBX_RPS: '10'
      LBX_MAX_RUNTIME: '3150'
      LBX_BATCH_SIZE: '360'
      LBX_TARGET_FLOOR: '14000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check -q requests
      - name: Crawl nationwide LBX-linked stores
        run: python scripts/lbx_national_crawl.py
      - name: Upload crawl output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbx-national-store-crawl
          path: lbx_national_output/
          retention-days: 2
          if-no-files-found: warn
          compression-level: 6
