name: LBX Fast Map Probe
on:
  push:
    branches: [tmp/lbx-poi-crawl-20260907]
    paths:
      - scripts/lbx_fast_map_probe.py
      - .github/workflows/lbx-fast-map-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -q requests playwright
          python -m playwright install --with-deps chromium >/dev/null
      - run: python scripts/lbx_fast_map_probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fast_map_probe_output
          git commit -m "Add fast LBX map probe output" || exit 0
          git push origin HEAD:tmp/lbx-poi-crawl-20260907
