name: LBX API Characterize

on:
  push:
    branches: ["tmp/lbx-poi-crawl-20260907"]
    paths:
      - "scripts/lbx_api_characterize.py"
      - ".github/workflows/lbx-api-characterize.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Characterize API
        run: python scripts/lbx_api_characterize.py
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api_characterize_output/ || true
          git diff --cached --quiet || git commit -m "chore: save LBX API characterization"
          git push origin HEAD:tmp/lbx-poi-crawl-20260907
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbx-api-characterize-output
          path: api_characterize_output/
          retention-days: 1
          if-no-files-found: warn
