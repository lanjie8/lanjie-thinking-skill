name: LBX Endpoint Parameter Probe
on:
  push:
    branches: [tmp/lbx-poi-crawl-20260907]
    paths:
      - scripts/lbx_endpoint_param_probe.py
      - .github/workflows/lbx-endpoint-param-probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - run: python scripts/lbx_endpoint_param_probe.py | tee endpoint_param_probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lbx-endpoint-param-probe
          path: endpoint_param_probe.txt
          retention-days: 1
