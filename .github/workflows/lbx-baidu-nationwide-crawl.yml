name: LBX Baidu Nationwide POI Crawl

on:
  push:
    branches:
      - tmp/lbx-poi-crawl-20260907
    paths:
      - scripts/lbx_baidu_nationwide_crawl.py
      - .github/workflows/lbx-baidu-nationwide-crawl.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LBX_MAX_WORKERS: '6'
      LBX_MAX_RETRIES: '4'
      LBX_REQUEST_TIMEOUT: '45'
      LBX_MAX_PAGES: '80'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Crawl nationwide LBX POIs
        run: python scripts/lbx_baidu_nationwide_crawl.py
      - name: Upload crawl output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbx-baidu-nationwide-poi
          path: lbx_baidu_nationwide_output/
          if-no-files-found: error
          retention-days: 7
