name: LBX Nationwide Store Crawl

on:
  push:
    branches: [tmp/lbx-poi-crawl-20260907]
    paths:
      - scripts/lbx_nationwide_crawler.py
      - .github/workflows/lbx-nationwide-crawl.yml

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  LBX_THREADS: '8'

jobs:
  crawl:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group:
          - south_central
          - east_coast
          - north_central
          - southwest_south
          - northwest
          - north_northeast
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests shapely
      - name: Crawl ${{ matrix.group }}
        run: python scripts/lbx_nationwide_crawler.py --group "${{ matrix.group }}" --output "crawl_part/${{ matrix.group }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lbx-crawl-part-${{ matrix.group }}
          path: crawl_part/${{ matrix.group }}
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: crawl
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install merge dependencies
        run: python -m pip install --disable-pip-version-check requests shapely
      - uses: actions/download-artifact@v4
        with:
          pattern: lbx-crawl-part-*
          path: crawl_parts
          merge-multiple: true
      - name: Merge and deduplicate national results
        run: python scripts/lbx_nationwide_crawler.py --merge crawl_parts --output lbx_nationwide_crawl_output
      - uses: actions/upload-artifact@v4
        with:
          name: lbx-nationwide-store-data
          path: lbx_nationwide_crawl_output
          retention-days: 1
          if-no-files-found: error
