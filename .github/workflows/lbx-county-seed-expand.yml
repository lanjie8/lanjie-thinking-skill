name: LBX County Seed Expand
on:
  push:
    branches: [tmp/lbx-poi-crawl-20260907]
    paths: [scripts/lbx_county_seed_expand.py, .github/workflows/lbx-county-seed-expand.yml]
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: tmp/lbx-poi-crawl-20260907}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q requests
      - run: python scripts/lbx_county_seed_expand.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add county_seed_output
          git commit -m "Add county-level LBX crawl seeds [skip ci]" || exit 0
          git pull --rebase origin tmp/lbx-poi-crawl-20260907
          git push origin HEAD:tmp/lbx-poi-crawl-20260907
