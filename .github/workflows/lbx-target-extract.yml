name: LBX Targeted Candidate Extract

on:
  push:
    branches: [tmp/lbx-poi-crawl-20260907]
    paths:
      - scripts/lbx_target_extract.py
      - .github/workflows/lbx-target-extract.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract targeted candidates
        run: python scripts/lbx_target_extract.py
      - name: Commit target output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add target_output
          git commit -m "Add targeted LBX candidate report [skip ci]" || exit 0
          git pull --rebase origin tmp/lbx-poi-crawl-20260907
          git push origin HEAD:tmp/lbx-poi-crawl-20260907
