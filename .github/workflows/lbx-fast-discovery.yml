name: LBX Fast Discovery

on:
  push:
    branches:
      - tmp/lbx-poi-crawl-20260907
    paths:
      - scripts/lbx_fast_discovery.py
      - .github/workflows/lbx-fast-discovery.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 openpyxl
      - name: Run fast discovery
        run: python3 scripts/lbx_fast_discovery.py
      - name: Commit discovery output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fast_output
          git commit -m "chore: save LBX fast discovery results" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin tmp/lbx-poi-crawl-20260907 && git push origin HEAD:tmp/lbx-poi-crawl-20260907 && exit 0
            sleep 5
          done
          exit 1
