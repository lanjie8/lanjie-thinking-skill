name: Baidu Quick POI Probe

on:
  push:
    branches:
      - tmp/lbx-poi-crawl-20260907
    paths:
      - scripts/baidu_quick_probe.py
      - .github/workflows/baidu-quick-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Probe Baidu POI endpoint
        run: python scripts/baidu_quick_probe.py
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baidu_quick_output
          git commit -m "Add Baidu quick POI probe results" || exit 0
          git push origin HEAD:tmp/lbx-poi-crawl-20260907
