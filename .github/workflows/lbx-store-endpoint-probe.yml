name: LBX Store Endpoint Probe

on:
  push:
    branches: ["tmp/lbx-poi-crawl-20260907"]
    paths:
      - "scripts/lbx_store_endpoint_probe.py"
      - ".github/workflows/lbx-store-endpoint-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Probe public store endpoint
        run: python scripts/lbx_store_endpoint_probe.py
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbx-store-endpoint-probe-output
          path: store_endpoint_probe_output/
          retention-days: 1
          if-no-files-found: warn

