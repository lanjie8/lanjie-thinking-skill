name: LBX Compact Discovery Outputs

on:
  push:
    branches: [tmp/lbx-poi-crawl-20260907]
    paths:
      - scripts/lbx_compact_outputs.py
      - .github/workflows/lbx-compact.yml

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact candidate reports
        run: python scripts/lbx_compact_outputs.py
      - name: Commit compact output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compact_output
          git commit -m "Add compact LBX discovery reports [skip ci]" || exit 0
          git push origin HEAD:tmp/lbx-poi-crawl-20260907
