name: NHSA Public API Probe

on:
  push:
    branches:
      - tmp/lbx-poi-crawl-20260907
    paths:
      - scripts/nhsa_public_api_probe.py
      - .github/workflows/nhsa-public-api-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Discover NHSA public endpoints
        run: python scripts/nhsa_public_api_probe.py
      - name: Commit discovery output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nhsa_probe_output
          git commit -m "Add NHSA public endpoint probe results" || exit 0
          git pull --rebase origin tmp/lbx-poi-crawl-20260907
          git push origin HEAD:tmp/lbx-poi-crawl-20260907
