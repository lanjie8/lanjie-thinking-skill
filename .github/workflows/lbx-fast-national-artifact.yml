name: LBX Fast National Artifact

on:
  push:
    branches: [tmp/lbx-poi-crawl-20260907]
    paths:
      - .github/workflows/lbx-fast-national-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONUNBUFFERED: '1'
      LBX_WORKERS: '128'
      LBX_RPS: '80'
      LBX_MAX_RUNTIME: '780'
      LBX_BATCH_SIZE: '2000'
      LBX_TARGET_FLOOR: '15100'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Crawl national LBX public store endpoint
        run: python scripts/lbx_national_crawl.py
      - name: Show summary
        if: always()
        run: |
          find lbx_national_output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          cat lbx_national_output/crawl_stats.json || true
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbx-fast-national-output
          path: lbx_national_output/
          retention-days: 2
          if-no-files-found: warn
          compression-level: 6
