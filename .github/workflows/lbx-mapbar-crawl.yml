name: LBX Mapbar Nationwide Crawl

on:
  push:
    branches:
      - tmp/lbx-poi-crawl-20260907
    paths:
      - scripts/lbx_mapbar_crawler.py
      - .github/workflows/lbx-mapbar-crawl.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -q requests beautifulsoup4 brotli cpca pandas openpyxl
      - name: Crawl public Mapbar directories and matched details
        run: python scripts/lbx_mapbar_crawler.py
      - name: Upload crawl artifact
        uses: actions/upload-artifact@v4
        with:
          name: lbx-mapbar-crawl
          path: mapbar_output
          retention-days: 5
      - name: Commit crawl outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapbar_output
          git commit -m "chore: save nationwide LBX Mapbar crawl" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin tmp/lbx-poi-crawl-20260907 && git push origin HEAD:tmp/lbx-poi-crawl-20260907 && exit 0
            sleep 5
          done
          exit 1
