name: LBX National Fast Crawl

on:
  push:
    branches:
      - tmp/lbx-poi-crawl-20260907
    paths:
      - '.github/workflows/lbx-national-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests
      - name: Crawl nationwide public LBX store API
        env:
          LBX_WORKERS: '28'
          LBX_RPS: '25'
          LBX_MAX_RUNTIME: '1200'
          LBX_BATCH_SIZE: '900'
          LBX_TARGET_FLOOR: '14000'
          LBX_OUT_DIR: 'lbx_national_fast_output'
        run: python scripts/lbx_national_crawl.py
      - name: Show summary
        if: always()
        run: |
          find lbx_national_fast_output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          cat lbx_national_fast_output/crawl_stats.json || true
      - name: Upload crawl output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbx-national-fast-store-data
          path: lbx_national_fast_output/
          retention-days: 7
          if-no-files-found: warn
