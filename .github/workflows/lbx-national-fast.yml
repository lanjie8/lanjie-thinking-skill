name: LBX National Fast Crawl

on:
  push:
    branches:
      - tmp/lbx-poi-crawl-20260907
    paths:
      - '.github/workflows/lbx-national-fast.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests
      - name: Crawl nationwide public LBX store API
        env:
          LBX_WORKERS: '28'
          LBX_RPS: '25'
          LBX_MAX_RUNTIME: '1200'
          LBX_BATCH_SIZE: '900'
          LBX_TARGET_FLOOR: '14000'
          LBX_OUT_DIR: 'lbx_national_fast_output'
        run: python scripts/lbx_national_crawl.py
      - name: Show summary
        if: always()
        run: |
          find lbx_national_fast_output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          cat lbx_national_fast_output/crawl_stats.json || true
      - name: Upload crawl output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbx-national-fast-store-data
          path: lbx_national_fast_output/
          retention-days: 7
          if-no-files-found: warn
      - name: Publish crawl output to temporary branch
        if: always()
        shell: bash
        run: |
          if [ ! -d lbx_national_fast_output ]; then
            echo 'No crawl output directory.'
            exit 0
          fi
          mkdir -p data/lbx_national_fast
          cp -R lbx_national_fast_output/. data/lbx_national_fast/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lbx_national_fast
          if git diff --cached --quiet; then
            echo 'No crawl output to publish.'
            exit 0
          fi
          git commit -m 'Publish fast nationwide LBX store crawl'
          git pull --rebase origin tmp/lbx-poi-crawl-20260907
          git push origin HEAD:tmp/lbx-poi-crawl-20260907
