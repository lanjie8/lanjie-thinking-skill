name: LBX Accelerated Store Crawl

on:
  push:
    branches: ["tmp/lbx-poi-crawl-20260907"]
    paths:
      - "scripts/lbx_fast_bfs_crawl.py"
      - ".github/workflows/lbx-fast-bfs-crawl.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  LBX_WORKERS: "32"
  LBX_BATCH_SIZE: "800"
  LBX_MAX_REQUESTS: "30000"
  LBX_MAX_SECONDS: "3300"
  LBX_SEED_STEP: "2.0"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/lbx-poi-crawl-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Crawl public LBX store graph
        run: python scripts/lbx_fast_bfs_crawl.py
      - name: Upload crawl output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbx-fast-bfs-output
          path: lbx_fast_bfs_output/
          retention-days: 3
          if-no-files-found: error
